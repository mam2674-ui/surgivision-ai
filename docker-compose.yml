services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    volumes:
      - research-temporary:/app/.data
      - ./models:/app/models:ro
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    restart: unless-stopped
volumes:
  research-temporary:
