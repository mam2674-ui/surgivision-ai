seed: 42
backbone: resnet50
pretrained: true
fine_tune: frozen
model: lstm
hidden: 512
layers: 2
dropout: 0.3
bidirectional: false
sample_fps: 1.0
sequence_length: 32
batch_size: 4
epochs: 30
learning_rate: 0.0001
weight_decay: 0.01
patience: 5
grad_clip: 1.0
class_weighting: false
loss: cross_entropy
smoothing_alpha: 0.4
uncertainty_threshold: 0.65
